name: Weekly scan and deploy

# The real weekly run.
#
# Runs once a week, persists the incremental scan state, commits the generated
# JSON, and deploys the site to GitHub Pages.
#
# The same work is performed by `scripts/run-weekly.sh`, which is what an
# on-premise cronjob executes. Keeping one script for both means switching the
# scheduler does not change the pipeline.

on:
  schedule:
    # Every Monday at 18:00 UTC, which is Tuesday 03:00 KST.
    - cron: '0 18 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: '저장된 상태를 무시하고 전체를 다시 분석합니다.'
        type: boolean
        default: false
      use_llm:
        description: 'LLM 계층을 호출할지 여부 (기본값은 설정 파일을 따릅니다)'
        type: choice
        default: config
        options:
          - config
          - 'on'
          - 'off'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan:
    name: 주간 스캔
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          # The scan state lives in the repository history, so a shallow
          # checkout would lose the previous run's database.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: 스캔 상태 복원
        uses: actions/cache@v4
        with:
          # Clones are cached so a weekly run fetches instead of cloning.
          path: .cache
          key: scout-cache-${{ github.run_id }}
          restore-keys: |
            scout-cache-

      - name: 주간 스캔 실행
        env:
          PYTHONPATH: pipeline/src
          PYTHONIOENCODING: utf-8
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOUT_LLM_API_KEY: ${{ secrets.SCOUT_LLM_API_KEY }}
        run: |
          ARGS="scan"
          [ "${{ inputs.full }}" = "true" ] && ARGS="$ARGS --full"
          case "${{ inputs.use_llm }}" in
            "on") ARGS="$ARGS --llm" ;;
            "off") ARGS="$ARGS --no-llm" ;;
          esac
          echo "실행: python -m scout $ARGS"
          python -m scout $ARGS | tee weekly-summary.txt

      - name: 요약을 작업 결과에 기록
        if: always()
        run: |
          {
            echo '## 주간 스캔 요약'
            echo
            echo '```'
            tail -n 60 weekly-summary.txt 2>/dev/null || echo '요약을 생성하지 못했습니다.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 결과 커밋
        run: |
          git config user.name 'camera-tech-scout'
          git config user.email 'camera-tech-scout@users.noreply.github.com'
          git add data .cache/candidates.sqlite3 2>/dev/null || git add data
          if git diff --cached --quiet; then
            echo '변경된 결과가 없습니다. 커밋하지 않습니다.'
          else
            git commit -m "chore: weekly scan $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 산출 JSON 업로드
        uses: actions/upload-artifact@v4
        with:
          name: weekly-data
          path: data/
          retention-days: 90

  deploy:
    name: GitHub Pages 배포
    runs-on: ubuntu-latest
    needs: scan
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 최신 결과 가져오기
        run: git pull --ff-only || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/configure-pages@v5
        id: pages

      - name: 의존성 설치
        working-directory: site
        run: npm ci

      - name: 사이트 빌드
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v4
