name: Weekly scan

# The real weekly run.
#
# Runs once a week, persists the incremental scan state, commits the generated
# JSON, and produces the built site.
#
# Publishing has two modes:
#
#   default            the built site is uploaded as a workflow artifact. This
#                      is what works on a private repository under the Free
#                      plan, where GitHub Pages is not available.
#   ENABLE_PAGES=true  additionally deploy to GitHub Pages. Set that repository
#                      variable once the repository is public or the account is
#                      on Pro or above:
#                        gh variable set ENABLE_PAGES --body true
#                      and set Settings -> Pages -> Source to "GitHub Actions".
#
# The scan itself is identical either way, and `scripts/run-weekly.sh` performs
# the same work for an on-premise cronjob.

on:
  schedule:
    # Every Monday at 18:00 UTC, which is Tuesday 03:00 KST.
    - cron: '0 18 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: '저장된 상태를 무시하고 전체를 다시 분석합니다.'
        type: boolean
        default: false
      use_llm:
        description: 'LLM 계층을 호출할지 여부 (기본값은 설정 파일을 따릅니다)'
        type: choice
        default: config
        options:
          - config
          - 'on'
          - 'off'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan:
    name: 주간 스캔
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          # The scan state lives in the repository history, so a shallow
          # checkout would lose the previous run's database.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: clone 캐시 복원
        uses: actions/cache@v4
        with:
          # Clones are cached so a weekly run fetches instead of cloning.
          path: .cache
          key: scout-cache-${{ github.run_id }}
          restore-keys: |
            scout-cache-

      - name: 주간 스캔 실행
        env:
          PYTHONPATH: pipeline/src
          PYTHONIOENCODING: utf-8
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOUT_LLM_API_KEY: ${{ secrets.SCOUT_LLM_API_KEY }}
        run: |
          ARGS="scan"
          [ "${{ inputs.full }}" = "true" ] && ARGS="$ARGS --full"
          case "${{ inputs.use_llm }}" in
            "on") ARGS="$ARGS --llm" ;;
            "off") ARGS="$ARGS --no-llm" ;;
          esac
          echo "실행: python -m scout $ARGS"
          python -m scout $ARGS | tee weekly-summary.txt

      - name: 요약을 작업 결과에 기록
        if: always()
        run: |
          {
            echo '## 주간 스캔 요약'
            echo
            echo '```'
            tail -n 60 weekly-summary.txt 2>/dev/null || echo '요약을 생성하지 못했습니다.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 결과 커밋
        run: |
          git config user.name 'camera-tech-scout'
          git config user.email 'camera-tech-scout@users.noreply.github.com'
          git add data
          # The scan database is committed so the next run can compute status
          # transitions. .gitignore keeps the rest of .cache out.
          [ -f .cache/candidates.sqlite3 ] && git add -f .cache/candidates.sqlite3
          if git diff --cached --quiet; then
            echo '변경된 결과가 없습니다. 커밋하지 않습니다.'
          else
            git commit -m "chore: weekly scan $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 산출 JSON 업로드
        uses: actions/upload-artifact@v4
        with:
          name: weekly-data
          path: data/
          retention-days: 90

  site:
    name: 사이트 빌드
    runs-on: ubuntu-latest
    needs: scan
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 최신 결과 가져오기
        run: git pull --ff-only || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 의존성 설치
        working-directory: site
        run: npm ci

      - name: 사이트 빌드
        working-directory: site
        run: npm run build

      - name: 생성된 페이지 확인
        run: |
          COUNT=$(find site/dist -name '*.html' | wc -l)
          echo "생성된 HTML 페이지: $COUNT개"
          echo "- 생성된 HTML 페이지 **$COUNT개**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -lt 10 ]; then
            echo "::error::페이지가 10개 미만입니다. 라우트 생성에 문제가 있습니다."
            exit 1
          fi

      # The default publishing route on a private repository under the Free
      # plan. Download this artifact, or let the on-premise cronjob publish
      # instead; `scripts/run-weekly.sh` writes to $SCOUT_PUBLISH_DIR.
      - name: 사이트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
          retention-days: 90

      - name: 배포 안내
        run: |
          {
            echo '### 사이트 배포'
            echo
            if [ "${{ vars.ENABLE_PAGES }}" = "true" ]; then
              echo 'GitHub Pages 배포가 활성화되어 있습니다. `pages` job 결과를 확인하십시오.'
            else
              echo '`site` 아티팩트로 업로드했습니다. GitHub Pages로 배포하려면'
              echo '저장소를 public으로 바꾸거나 Pro 이상 플랜으로 올린 뒤'
              echo '`gh variable set ENABLE_PAGES --body true` 를 실행하십시오.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  pages:
    name: GitHub Pages 배포
    # Skipped unless the repository variable is set. GitHub Pages is not
    # available for a private repository on the Free plan, so enabling this
    # before that changes would only produce a failing job every week.
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    needs: scan
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 최신 결과 가져오기
        run: git pull --ff-only || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/configure-pages@v5
        id: pages

      - name: 의존성 설치
        working-directory: site
        run: npm ci

      - name: 사이트 빌드
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v4
