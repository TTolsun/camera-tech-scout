[project]
name = "camera-tech-scout"
version = "0.1.0"
description = "Evidence-first patent and paper candidate discovery for camera software repositories."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.32",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
]

[project.scripts]
scout = "scout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
